name: Verify NeighborGear
on: [push, pull_request]
jobs:
  local-checks:
    runs-on: ubuntu-latest
    env:
      NEIGHBORGEAR_MODE: simulator
      NEIGHBORGEAR_CREDITS_VERIFIED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.7'
      - run: uv sync --frozen --all-extras --python 3.12
      - run: uv run --extra cloud pytest -q
      - run: uv run cfn-lint infra/template.yaml infra/cost-controls.yaml infra/workload-boundary.yaml infra/security-bootstrap.yaml infra/network-bootstrap.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
